<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>امتحان البرمجة - مستر بكري خليفة</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="exam-container">
      <!-- ترويسة الامتحان -->
      <header class="exam-header">
        <h1>امتحان البرمجة</h1>
        <h2>إعداد: مستر بكري خليفة</h2>
      </header>

      <!-- معلومات الامتحان والمؤقت -->
      <div class="exam-info">
        <span>عدد الأسئلة: 20</span>
        <span id="timer">الوقت: 40:00</span>
      </div>

      <div class="student-info">
        <input type="text" id="student-name" placeholder="اكتب اسم الطالب" />
        <input type="text" id="student-class" placeholder="اكتب الفصل" />
      </div>

      <!-- شريط التقدم -->
      <div id="progress">
        <div id="progress-bar"></div>
      </div>

      <!-- منطقة عرض الأسئلة -->
      <div id="question-area">
        <h2>مرحباً بك في الامتحان التفاعلي</h2>
        <p>يتكون الامتحان من 20 سؤالاً اختيارياً، والزمن المحدد 40 دقيقة.</p>
        <p>يرجى كتابة اسم الطالب والفصل ثم الضغط على زر البدء.</p>
      </div>

      <button id="start-btn">بدء الامتحان</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
